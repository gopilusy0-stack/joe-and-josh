<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Joe & Josh | Smart Computer & Tech Support</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f1f5f9;
  color: #111827;
}

header {
  background: #080d18;
  color: white;
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.header-inner {
  max-width: 1050px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 13px;
}

.logo {
  width: 50px;
  height: 50px;
  border-radius: 15px;
  background: linear-gradient(135deg, #2563eb, #9333ea);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
  font-weight: bold;
}

.brand {
  font-size: 24px;
  font-weight: 900;
}

.tagline {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 3px;
}

.hero {
  background:
    radial-gradient(circle at 15% 20%, rgba(37,99,235,.35), transparent 35%),
    radial-gradient(circle at 85% 30%, rgba(147,51,234,.30), transparent 35%),
    #080d18;
  color: white;
  text-align: center;
  padding: 70px 20px 90px;
}

.hero-content {
  max-width: 800px;
  margin: auto;
}

.badge {
  display: inline-block;
  padding: 8px 15px;
  border-radius: 30px;
  background: rgba(255,255,255,.10);
  color: #c7d2fe;
  font-size: 13px;
  font-weight: bold;
}

.hero h1 {
  font-size: clamp(40px, 8vw, 70px);
  line-height: 1;
  margin: 20px 0;
}

.gradient {
  background: linear-gradient(90deg, #60a5fa, #c084fc);
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  max-width: 650px;
  margin: auto;
  color: #cbd5e1;
  font-size: 18px;
  line-height: 1.6;
}

.hero-button {
  display: inline-block;
  margin-top: 28px;
  padding: 15px 25px;
  border-radius: 12px;
  background: linear-gradient(90deg, #2563eb, #9333ea);
  color: white;
  text-decoration: none;
  font-weight: bold;
}

main {
  max-width: 1050px;
  margin: -35px auto 50px;
  padding: 0 18px;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 30px;
  margin-bottom: 25px;
  box-shadow: 0 15px 45px rgba(15,23,42,.10);
}

.card h2 {
  margin-top: 0;
  font-size: 28px;
}

.subtitle {
  color: #64748b;
  line-height: 1.6;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.full {
  grid-column: 1 / -1;
}

.field {
  margin-top: 15px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: bold;
  color: #334155;
}

input,
select,
textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid #dbe2ea;
  border-radius: 12px;
  background: #f8fafc;
  font-size: 15px;
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #6366f1;
  background: white;
}

textarea {
  min-height: 130px;
  resize: vertical;
}

.analyze-button,
.request-button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.analyze-button {
  background: linear-gradient(90deg, #2563eb, #9333ea);
}

.request-button {
  background: #111827;
}

.analyze-button:disabled,
.request-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#loading {
  display: none;
  text-align: center;
  margin-top: 15px;
  color: #64748b;
}

#result {
  display: none;
  margin-top: 20px;
  padding: 22px;
  border-radius: 16px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
}

.result-box {
  padding: 16px;
  background: white;
  border-radius: 12px;
  margin-top: 12px;
  line-height: 1.6;
}

.result-title {
  font-size: 13px;
  font-weight: bold;
  color: #64748b;
  margin-bottom: 5px;
  text-transform: uppercase;
}

#sendSection {
  display: none;
}

.status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  display: none;
  font-size: 14px;
}

.steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  text-align: center;
}

.step {
  padding: 20px;
  border: 1px solid #e2e8f0;
  border-radius: 18px;
}

.step-icon {
  font-size: 32px;
}

.step h3 {
  margin-bottom: 5px;
}

.step p {
  color: #64748b;
  font-size: 14px;
  line-height: 1.5;
}

footer {
  background: #080d18;
  color: #94a3b8;
  text-align: center;
  padding: 30px 20px;
}

footer strong {
  color: white;
}

@media (max-width: 700px) {

  .brand {
    font-size: 20px;
  }

  .hero {
    padding: 55px 18px 75px;
  }

  .hero p {
    font-size: 16px;
  }

  .card {
    padding: 22px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

  .steps {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">J</div>

    <div>
      <div class="brand">JOE &amp; JOSH</div>

      <div class="tagline">
        Smart Computer &amp; Tech Support
      </div>
    </div>

  </div>
</header>


<section class="hero">

  <div class="hero-content">

    <span class="badge">
      COMPUTER &amp; TECH SUPPORT
    </span>

    <h1>
      We Fix.<br>
      <span class="gradient">You Relax.</span
