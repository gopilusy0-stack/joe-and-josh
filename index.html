<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joe and Josh - Computer Repair Service</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2e;
      --text-color: #ffffff;
      --text-secondary: #94a3b8;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --border-color: #1e293b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      margin: 0;
      color: var(--accent-color);
    }

    .header p {
      color: var(--text-secondary);
      margin-top: 5px;
      font-size: 14px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    label {
      display: block;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 8px;
      margin-top: 15px;
    }

    select, textarea {
      width: 100%;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      display: none;
    }

    .res-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .res-label {
      color: var(--text-secondary);
    }

    .res-value {
      font-weight: bold;
      color: #10b981;
    }

    .reason-box {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      border-top: 1px dashed var(--border-color);
      padding-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Joe and Josh</h1>
    <p>We Fix. You Relax.</p>
  </div>

  <div class="card">
    <h2>✨ Smart Service Estimator</h2>
    
    <label for="category">Select Service Category</label>
    <select id="category">
      <option value="Laptop Repair">Laptop Repair</option>
      <option value="Desktop PC Repair">Desktop PC Repair</option>
      <option value="Software Issue">Software Issue</option>
      <option value="Hardware Replacement">Hardware Replacement</option>
    </select>

    <label for="problem">Describe Your Issue</label>
    <textarea id="problem" rows="4" placeholder="e.g., Game won't open, screen flicker, PC not turning on..."></textarea>

    <button onclick="calculateCharge()">Calculate Charge</button>

    <div id="result"></div>
  </div>
</div>

<script>
  async function calculateCharge() {
    const category = document.getElementById('category').value;
    const problem = document.getElementById('problem').value;
    const resultDiv = document.getElementById('result');

    if (!problem.trim()) {
      alert("Please describe the problem first.");
      return;
    }

    resultDiv.style.display = 'block';
    resultDiv.innerHTML = "<p style='color: #94a3b8; text-align: center;'>Calculating estimate with AI...</p>";

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBNi7x1nduDcVHo7N7pUZZFqdwmj_2oZiUEegklm2vA5obYtQQssj-Ey90ZrI5txEY/exec";

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ category: category, problem: problem })
      });

      const data = await response.json();

      let aiResponse = data;
      if (data.candidates && data.candidates[0]) {
        try {
          aiResponse = JSON.parse(data.candidates[0].content.parts[0].text);
        } catch(e) {
          aiResponse = data;
        }
      }

      resultDiv.innerHTML = `
        <div class="res-item">
          <span class="res-label">Difficulty Level:</span>
          <span class="res-value" style="color: #f59e0b;">${aiResponse.level || 'Standard'}</span>
        </div>
        <div class="res-item">
          <span class="res-label">Estimated Price:</span>
          <span class="res-value">₹${aiResponse.price || '0'}</span>
        </div>
        <div class="reason-box">
          <strong>Note:</strong> ${aiResponse.reason || 'Estimate calculated based on issue complexity.'}
        </div>
      `;
    } catch (error) {
      resultDiv.innerHTML = "<p style='color:#ef4444; text-align: center;'>Failed to get estimate. Please check API Key or Script configuration.</p>";
      console.error(error);
    }
  }
</script>

</body>
</html>
