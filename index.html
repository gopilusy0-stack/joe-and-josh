<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joe & Josh Computer Repair Service</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    select, textarea, button {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      margin-top: 20px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      background-color: #e9ecef;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Service Charge Estimator</h2>
  
  <label for="category">Select Category:</label>
  <select id="category">
    <option value="Laptop Repair">Laptop Repair</option>
    <option value="Desktop PC Repair">Desktop PC Repair</option>
    <option value="Software Issue">Software Issue</option>
    <option value="Hardware Replacement">Hardware Replacement</option>
  </select>

  <label for="problem">Describe the Problem:</label>
  <textarea id="problem" rows="4" placeholder="Describe what issue you are facing..."></textarea>

  <button onclick="calculateCharge()">Calculate Charge</button>

  <div id="result">
    <h3>Estimation Result:</h3>
    <p><strong>Difficulty Level:</strong> <span id="level"></span></p>
    <p><strong>Estimated Price:</strong> ₹<span id="price"></span></p>
    <p><strong>Reason:</strong> <span id="reason"></span></p>
  </div>
</div>

<script>
  async function calculateCharge() {
    const category = document.getElementById('category').value;
    const problem = document.getElementById('problem').value;
    const resultDiv = document.getElementById('result');

    if (!problem.trim()) {
      alert("Please describe the problem first.");
      return;
    }

    resultDiv.style.display = 'block';
    resultDiv.innerHTML = "Calculating estimate...";

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBNi7x1nduDcVHo7N7pUZZFqdwmj_2oZiUEegklm2vA5obYtQQssj-Ey90ZrI5txEY/exec";

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ category: category, problem: problem })
      });

      const data = await response.json();
      const aiResponse = JSON.parse(data.candidates[0].content.parts[0].text);

      resultDiv.innerHTML = `
        <h3>Estimation Result:</h3>
        <p><strong>Difficulty Level:</strong> ${aiResponse.level}</p>
        <p><strong>Estimated Price:</strong> ₹${aiResponse.price}</p>
        <p><strong>Reason:</strong> ${aiResponse.reason}</p>
      `;
    } catch (error) {
      resultDiv.innerHTML = "<p style='color:red;'>Failed to get estimate. Please try again later.</p>";
      console.error(error);
    }
  }
</script>

</body>
</html>
