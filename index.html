<style>

* {
  box-sizing: border-box;

}

html {

body {

  color: white;
}

a {

}

/* NAVBAR */

.navbar {
  height: 72px;
  background: #060a12;
  border-bottom: 1px solid #20283a;

  align-items: center;
  justify-content: space-between;
  padding: 0 6%;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 19px;
  font-weight: 800;
}

.logo-box {
  width: 38px;
  height: 38px;
  border-radius: 10px;

  justify-content: center;

}

.nav-links {
  display: flex;
  gap: 25px;
}

.nav-links a {
  color: #cbd5e1;
  font-size: 14px;
}

.nav-links a:hover {
  color: white;
}

.nav-button {
  background: linear-gradient(100deg,#147cff,#a43cff);
  padding: 11px 17px;
  color: white;
  border-radius: 10px;
  font-weight: bold;
  font-size: 13px;
}

/* HERO */

.hero {

}

.hero-content {
  max-width: 700px;
}

.badge {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid #ffffff20;
  background: #ffffff08;
  color: #b9d6ff;
  font-size: 12px;
  font-weight: bold;
}

.hero h1 {
  font-size: clamp(45px,7vw,75px);
  line-height: 1;
  margin: 25px 0;
}

.gradient {
  background: linear-gradient(90deg,#219cff,#a43cff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero p {
  max-width: 620px;

  color: white;
  font-weight: bold;
}

.secondary-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 15px 22px;
  border-radius: 12px;
  border: 1px solid #526078;
  color: white;
  font-weight: bold;
}

.trust {
  display: flex;
  gap: 25px;
  margin-top: 28px;
  color: #aeb9ca;
  font-size: 13px;
}

/* HERO GRAPHIC */

.hero-graphic {
  height: 390px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

.glow {
  position: absolute;
  width: 330px;
  height: 330px;
  border-radius: 50%;
  background: #197cff35;
  filter: blur(60px);
}

.monitor {
  position: relative;
  font-size: 175px;
  filter: drop-shadow(0 25px 35px #00000090);
}

.laptop {
  position: absolute;
  right: 10%;

  font-size: 105px;
}

.tools {
  position: absolute;
  right: 7%;
  top: 10%;
  width: 105px;
  height: 105px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #071020;
  border: 3px solid #278cff;
  font-size: 48px;
}

/* STATS */

.stats {
  margin: -30px 5% 0;
  position: relative;
  z-index: 5;
  background: #111827;
  border-radius: 20px;
  padding: 28px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  box-shadow: 0 20px 45px #00000040;
}

.stat {
  text-align: center;
  border-right: 1px solid #334155;
}

.stat:last-child {
  border-right: none;
}

.stat strong {
  display: block;
  font-size: 22px;
  margin-bottom: 5px;
}

.stat span {
  color: #94a3b8;
  font-size: 13px;
}

/* SECTION */

.section {

}

.heading {
  max-width: 750px;
  text-align: center;

}

.heading-label {

  padding: 8px 13px;

  background: #eaf1ff;
  color: #2457c5;
  font-size: 12px;
  font-weight: bold;
}

.heading h2 {
  font-size: 43px;
  margin: 15px 0;
}

.heading p {
  color: #64748b;
  line-height: 1.6;
}

/* SERVICES */

.services {
  max-width: 1150px;

}

}

.service-icon {
  font-size: 30px;
  margin-bottom: 18px;
}

.service h3 {
  margin-bottom: 8px;
}

.service p {
  color: #94a3b8;
  line-height: 1.55;
  font-size: 14px;
}

/* REQUEST SECTION */

.request-section {
  background: #eef2f8;
  color: #111827;
}

.form-container {
  max-width: 650px;
  margin: auto;
}

.form-box {
  background: white;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 15px 40px #00000018;
}

.form-box h3 {
  font-size: 24px;
  margin-bottom: 8px;
}

.form-box > p {
  color: #64748b;
  margin-bottom: 25px;
}
